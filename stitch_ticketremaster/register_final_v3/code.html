<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#4c2300",
                        "surface-container": "#1a1919",
                        "error-dim": "#d53d18",
                        "secondary-fixed-dim": "#d6d4d3",
                        "secondary-container": "#474746",
                        "outline": "#777575",
                        "primary": "#ff9153",
                        "inverse-on-surface": "#565554",
                        "secondary-dim": "#d6d4d3",
                        "surface-container-highest": "#262626",
                        "on-primary": "#511f00",
                        "primary-fixed": "#ff7a23",
                        "on-secondary-container": "#d2d0cf",
                        "on-secondary": "#525151",
                        "on-surface-variant": "#adaaaa",
                        "surface-dim": "#0e0e0e",
                        "surface-container-high": "#201f1f",
                        "on-error-container": "#ffd2c8",
                        "tertiary": "#ffa765",
                        "error": "#ff7351",
                        "error-container": "#b92902",
                        "primary-container": "#ff7a23",
                        "secondary": "#e4e2e1",
                        "on-tertiary-fixed-variant": "#5d2c00",
                        "tertiary-fixed": "#ff9742",
                        "tertiary-container": "#fd933d",
                        "on-primary-fixed-variant": "#4e1e00",
                        "inverse-primary": "#9e4400",
                        "surface": "#0e0e0e",
                        "primary-fixed-dim": "#f06c0b",
                        "surface-bright": "#2c2c2c",
                        "inverse-surface": "#fcf8f8",
                        "surface-tint": "#ff9153",
                        "primary-dim": "#fd761a",
                        "outline-variant": "#494847",
                        "tertiary-dim": "#ec8731",
                        "surface-variant": "#262626",
                        "on-surface": "#ffffff",
                        "tertiary-fixed-dim": "#f08934",
                        "surface-container-low": "#131313",
                        "on-error": "#450900",
                        "on-secondary-fixed": "#3f3f3f",
                        "on-background": "#ffffff",
                        "on-primary-fixed": "#000000",
                        "on-tertiary-fixed": "#2b1100",
                        "secondary-fixed": "#e4e2e1",
                        "on-secondary-fixed-variant": "#5c5b5b",
                        "background": "#0e0e0e",
                        "surface-container-lowest": "#000000",
                        "on-primary-container": "#3f1700",
                        "on-tertiary": "#5b2c00"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0e0e0e;
        }
        .spotlight {
            background: radial-gradient(circle at 50% 30%, rgba(255, 145, 83, 0.08) 0%, rgba(14, 14, 14, 0) 70%);
        }
    </style>
</head>
<body class="bg-background text-on-surface selection:bg-primary/30 min-h-screen flex flex-col items-center">
<!-- Spotlight Background Effect -->
<div class="fixed inset-0 spotlight pointer-events-none z-0"></div>
<!-- TopNavBar (Floating Pill) - Matched to Login Screen -->
<nav class="fixed top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-4xl rounded-full border border-white/10 bg-neutral-900/60 backdrop-blur-xl shadow-[0_12px_40px_rgba(255,255,255,0.04)] z-50 flex justify-between items-center px-8 py-3">
<div class="flex items-center">
<span class="text-xl font-black tracking-tighter text-white uppercase">TicketRemaster</span>
</div>
<div class="hidden md:flex gap-6 items-center absolute left-1/2 -translate-x-1/2">
<a class="text-neutral-400 font-medium hover:text-orange-400 transition-colors duration-300" href="#">Events</a>
<a class="text-neutral-400 font-medium hover:text-orange-400 transition-colors duration-300" href="#">Marketplace</a>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center text-neutral-400 hover:text-orange-400 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="flex items-center justify-center text-[#f97316] transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
</button>
</div>
</nav>
<main class="relative z-10 flex-grow flex justify-center items-center w-full px-6 py-12 pt-32">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Registration Card -->
<div class="w-full bg-surface-container-highest/60 backdrop-blur-2xl p-8 md:p-10 rounded-lg border border-outline-variant/20 shadow-[0_12px_40px_rgba(0,0,0,0.5)]">
<div class="mb-8 text-center">
<h1 class="text-3xl font-extrabold tracking-tight mb-2 text-white">Create Account</h1>
<p class="text-on-surface-variant body-lg leading-relaxed">Join the curated marketplace for high-end events.</p>
</div>
<form class="space-y-5">
<!-- Full Name Field -->
<div class="group">
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-1" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-highest border border-outline-variant/30 rounded-md py-4 pl-12 pr-4 text-white placeholder-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all" id="name" placeholder="Enter your name" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="group">
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full bg-surface-container-highest border border-outline-variant/30 rounded-md py-4 pl-12 pr-4 text-white placeholder-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Phone Number Field with Extension -->
<div class="group">
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-1" for="phone">Phone Number</label>
<div class="flex gap-2">
<div class="relative w-28 shrink-0">
<select class="w-full bg-surface-container-highest border border-outline-variant/30 rounded-md py-4 pl-4 pr-8 text-white focus:outline-none focus:border-primary/50 appearance-none transition-all cursor-pointer">
<option value="+65">+65</option>
<option value="+1">+1</option>
<option value="+44">+44</option>
<option value="+61">+61</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="relative flex-grow">
<input class="w-full bg-surface-container-highest border border-outline-variant/30 rounded-md py-4 px-4 text-white placeholder-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all" id="phone" placeholder="Phone number" type="tel"/>
</div>
</div>
</div>
<!-- Password Field -->
<div class="group">
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-highest border border-outline-variant/30 rounded-md py-4 pl-12 pr-4 text-white placeholder-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold py-4 rounded-md shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all mt-4" type="submit">
                    Register Account
                </button>
</form>
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Log In</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer Component - Exactly Matched to Login Screen -->
<footer class="w-full border-t border-neutral-900 bg-neutral-950 flex flex-col md:flex-row justify-between items-center px-12 py-16 z-10">
<div class="mb-8 md:mb-0">
<span class="text-lg font-bold text-orange-500">TicketRemaster</span>
<p class="mt-2 text-neutral-500 text-sm font-medium">© 2024 TicketRemaster. Crafted in the Obsidian Hearth.</p>
</div>
<div class="flex flex-wrap justify-center gap-8">
<a class="text-neutral-500 font-medium hover:text-white transition-colors opacity-80 hover:opacity-100" href="#">Terms</a>
<a class="text-neutral-500 font-medium hover:text-white transition-colors opacity-80 hover:opacity-100" href="#">Privacy</a>
<a class="text-neutral-500 font-medium hover:text-white transition-colors opacity-80 hover:opacity-100" href="#">Support</a>
<a class="text-neutral-500 font-medium hover:text-white transition-colors opacity-80 hover:opacity-100" href="#">Contact</a>
</div>
</footer>
</body></html>
